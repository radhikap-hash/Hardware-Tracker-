<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<?!= include('Styles') ?>
<style>body{background:var(--card)}</style>
</head>
<body>
  <div id="host"></div>
  <?!= include('FormBody') ?>
  <script>
    google.script.run.withSuccessHandler(function (data) {
      var sel = null;
      try {
        var name = window.PRESELECT;
        if (name) sel = data.boards.filter(function (b) { return b.project === name; })[0] || null;
      } catch (e) {}
      PCBForm.mount(document.getElementById('host'), {
        board: sel, lists: data.lists,
        onSaved: function () { setTimeout(google.script.host.close, 1200); },
        onCancel: google.script.host.close
      });
    }).getBoards();
  </script>
</body>
</html>
