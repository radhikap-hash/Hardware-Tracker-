<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PCB Tracker — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --card:#FFF; --ink:#16202E; --ink2:#455668; --muted:#7C8B9C;
  --rule:#D5DBE2; --soft:#E7EBF0; --focus:#2F5FA8;
  --done:#1B7A5A;  --done-bg:#DBEDE4;
  --wip:#A76608;   --wip-bg:#F9EBD1;
  --hold:#A8412A;  --hold-bg:#F6DFD7;
  --wait:#6D7E92;  --wait-bg:#E2E7ED;
  --stop:#6E2438;  --stop-bg:#EEDBE0;
  --late:#A8232F;  --late-bg:#F7DEE1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  font-size:14px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 22px 64px}

/* ---------------------------------------------------------------- topbar */
.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1360px;margin:0 auto;padding:14px 22px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.mark{font-size:19px;font-weight:600;letter-spacing:-.015em}
.mark span{color:var(--muted);font-weight:450}
.meta{color:var(--muted);font-size:12.5px}
.top-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:7px 13px;
     font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn-solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-solid:hover{background:#0C1521}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink2);padding:7px 9px}
.btn-quiet:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:default}

/* ------------------------------------------------------------------ hero */
.hero{margin:22px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px 14px}
.hero h2{margin:0 0 2px;font-size:15px;font-weight:600}
.hero p{margin:0 0 20px;color:var(--muted);font-size:12.5px}
.load{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;min-height:130px}
.load-col{display:flex;flex-direction:column;justify-content:flex-end;gap:7px;text-align:center}
.load-bar{position:relative;background:var(--soft);border-radius:4px 4px 0 0;min-height:3px;
          display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.load-fill{background:var(--wip);opacity:.85}
.load-fill.late{background:var(--late)}
.load-n{font-size:20px;font-weight:600;line-height:1}
.load-n.zero{color:var(--muted);font-weight:450}
.load-name{font-size:11.5px;color:var(--ink2);line-height:1.25}
.load-late{font-size:11px;color:var(--late);font-weight:500;min-height:15px}
.load-col:hover .load-bar{outline:1px solid var(--ink2)}

/* ------------------------------------------------------------------ stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 0}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:13px 15px;
      cursor:pointer;text-align:left}
.stat:hover{border-color:var(--ink2)}
.stat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat-n{font-size:25px;font-weight:600;line-height:1.1}
.stat-l{font-size:12px;color:var(--muted);margin-top:1px}
.stat.late .stat-n{color:var(--late)}
.stat.respin .stat-n{color:var(--hold)}

/* ---------------------------------------------------------------- toolbar */
.tools{display:flex;gap:9px;align-items:center;margin:22px 0 12px;flex-wrap:wrap}
.field{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:7px 11px;font-size:13px}
.field:focus{border-color:var(--focus);outline:none}
input.field{min-width:230px}
.spacer{margin-left:auto}
.count{color:var(--muted);font-size:12.5px}

/* -------------------------------------------------------------- accordion */
.grp{background:var(--card);border:1px solid var(--rule);border-radius:9px;margin-bottom:9px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;width:100%;
       background:none;border:0;text-align:left}
.grp-h:hover{background:#F7F9FB}
.caret{width:9px;height:9px;border-right:1.6px solid var(--ink2);border-bottom:1.6px solid var(--ink2);
       transform:rotate(-45deg);transition:transform .16s ease;flex:none;margin-right:2px}
.grp.open .caret{transform:rotate(45deg)}
.grp-name{font-weight:600;font-size:14.5px}
.grp-tags{margin-left:auto;display:flex;gap:7px;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--ink2)}
.tag.late{background:var(--late-bg);color:var(--late);font-weight:500}
.tag.hold{background:var(--hold-bg);color:var(--hold)}
.grp-body{display:none;border-top:1px solid var(--soft)}
.grp.open .grp-body{display:block}

/* ------------------------------------------------------------ board rows */
.row{display:block;padding:13px 16px 15px;border-top:1px solid var(--soft);width:100%;
     background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row-top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.row-right{margin-left:auto;display:flex;gap:11px;align-items:baseline}
.row:first-child{border-top:0}
.row:hover{background:#F7F9FB}
.row-name{font-weight:500;font-size:13.5px;overflow-wrap:anywhere}
.row-name .cust{color:var(--muted);font-weight:450}
.row-sub{font-size:11.5px;color:var(--muted)}
.row-stage{font-size:12.5px;color:var(--ink2)}
.row-cmt{font-size:12px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-late{font-size:12.5px;font-weight:600;color:var(--late)}
.row-late.none{color:var(--muted);font-weight:450}

/* the stage rail: one board's whole journey, with its due dates */
.rail7{display:grid;grid-template-columns:repeat(7,1fr);margin-top:11px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px}
.node::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--soft)}
.node:first-child::before{left:50%}
.node:last-child::before{right:50%}
.node.linkdone::before{background:var(--done);opacity:.45}
.pip{position:relative;width:11px;height:11px;border-radius:50%;background:var(--wait);opacity:.4;
     box-shadow:0 0 0 3px var(--card)}
.node[data-s="Completed"] .pip{background:var(--done);opacity:1}
.node[data-s="In Progress"] .pip{background:var(--wip);opacity:1}
.node[data-s="On Hold"] .pip{background:var(--hold);opacity:1}
.node[data-s="Cancelled"] .pip{background:var(--stop);opacity:1}
.node[data-s="NA"] .pip{background:var(--card);box-shadow:0 0 0 3px var(--card),inset 0 0 0 1.5px var(--rule);opacity:1}
.node.here .pip{box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--ink)}
.node-l{font-size:10.5px;color:var(--muted);line-height:1.2;text-align:center}
.node.here .node-l{color:var(--ink);font-weight:600}
.node-d{font-size:10.5px;color:var(--ink2);line-height:1.2;min-height:13px}
.node-d.over{color:var(--late);font-weight:600}
.node-d.none{color:var(--rule)}
.grp.dense .rail7{display:flex}
.grp.dense .node-l,.grp.dense .node-d{display:none}
.grp.dense .node{padding:0}

/* ------------------------------------------------------------------ chips */
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.chip[data-s="Completed"]{background:var(--done-bg);color:var(--done)}
.chip[data-s="In Progress"]{background:var(--wip-bg);color:var(--wip)}
.chip[data-s="On Hold"]{background:var(--hold-bg);color:var(--hold)}
.chip[data-s="Not Started"]{background:var(--wait-bg);color:var(--wait)}
.chip[data-s="Cancelled"]{background:var(--stop-bg);color:var(--stop)}
.chip[data-s="NA"]{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}

/* ------------------------------------------------------------- slide-over */
.veil{position:fixed;inset:0;background:rgba(18,28,40,.4);opacity:0;pointer-events:none;
      transition:opacity .18s ease;z-index:60}
.veil.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);
       border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .22s ease;
       z-index:61;display:flex;flex-direction:column}
.panel.on{transform:none}
.panel-h{padding:18px 22px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.panel-h h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.panel-b{padding:18px 22px 26px;overflow:auto;flex:1}
.panel-f{padding:13px 22px;border-top:1px solid var(--rule);display:flex;gap:8px;background:#FAFBFC}
.close{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 14px;font-size:13px;margin-bottom:20px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.step{display:grid;grid-template-columns:22px 1fr;gap:12px}
.step-rail{display:flex;flex-direction:column;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:var(--wait);opacity:.4;margin-top:5px;flex:none}
.dot[data-s="Completed"]{background:var(--done);opacity:1}
.dot[data-s="In Progress"]{background:var(--wip);opacity:1}
.dot[data-s="On Hold"]{background:var(--hold);opacity:1}
.dot[data-s="Cancelled"]{background:var(--stop);opacity:1}
.dot[data-s="NA"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule);opacity:1}
.rail{width:1.5px;flex:1;background:var(--soft);margin:4px 0}
.step-b{padding-bottom:16px}
.step-t{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.step-t b{font-size:13.5px;font-weight:500}
.step-m{font-size:12px;color:var(--muted);margin-top:2px}
.note{background:var(--wip-bg);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--wip);margin-bottom:18px}
.cmt{background:#F6F8FA;border-radius:6px;padding:11px 13px;font-size:12.5px;color:var(--ink2);margin-bottom:18px}

/* -------------------------------------------------------------- the form */
.form{padding:18px 22px 26px}
.form h4{margin:22px 0 9px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.form h4:first-child{margin-top:0}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;
   font-size:13px;background:var(--card);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--focus);outline:none}
.f textarea{resize:vertical;min-height:56px}
.srow{display:grid;grid-template-columns:96px 1fr 132px 132px;gap:9px;align-items:center;
      padding:7px 0;border-top:1px solid var(--soft)}
.srow:first-of-type{border-top:0}
.srow > span:first-child{font-size:12.5px;font-weight:500}
.verdict{background:#F6F8FA;border:1px solid var(--rule);border-radius:7px;padding:11px 14px;
         margin-top:18px;font-size:13px}
.verdict b{font-weight:600}
.verdict em{font-style:normal;color:var(--muted)}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--rule);
     padding:12px 22px;display:flex;gap:8px;align-items:center}
.msg{font-size:12.5px;color:var(--muted)}
.msg.bad{color:var(--late)}
.msg.good{color:var(--done)}
.respin-box{border:1px solid var(--hold);background:var(--hold-bg);border-radius:7px;padding:13px 15px;margin-top:18px}
.respin-box p{margin:0 0 10px;font-size:12.5px;color:var(--hold)}

.empty{background:var(--card);border:1px dashed var(--rule);border-radius:9px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-bottom:4px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .row-right{margin-left:0;width:100%}
  .row-cmt{white-space:normal}
  .node-l,.node-d{font-size:9.5px}
  .f-grid{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr;}
  .load{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="wrap">
  <section class="hero">

    <div>
      <h3 id="panel-title">Board</h3>
      <div class="meta" id="panel-sub"></div>
    </div>
    <button class="close" id="panel-x" aria-label="Close">&times;</button>
  </div>
  <div class="panel-b" id="panel-b"></div>
  <div class="panel-f" id="panel-f"></div>

<script>
/**
 * PCBForm.mount(el, opts)
 *   opts.board   existing board object, or null for a new one
 *   opts.lists   { statuses, stages, reasons, customers }
 *   opts.onSaved callback(result)
 *   opts.onCancel
 * Works inside the Sheets modal and inside the dashboard.
 */
window.PCBForm = (function () {
  var STAGES = [
    ['S1','Schematic','S1 Schematic'],
    ['S2','BOM','S2 BOM Procurement'],
    ['S3','Layout','S3 PCB Layout'],
    ['S4','SI & PI','S4 SI & PI'],
    ['S5','Fab','S5 Bare-PCB Fab'],
    ['S6','Assembly','S6 Assembly'],
    ['S7','Bring-up','S7 Bring-up']
  ];
  var CLOSED = { 'Completed':1, 'NA':1, 'Cancelled':1 };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function opts(list, sel, blank){
    var h = blank ? '<option value="">' + esc(blank) + '</option>' : '';
    (list || []).forEach(function(v){
      h += '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    if (sel && (list || []).indexOf(sel) < 0) h += '<option value="' + esc(sel) + '" selected>' + esc(sel) + '</option>';
    return h;
  }

  /** Mirrors the sheet formula so the form can tell you where the board will land. */
  function verdict(st){
    var cancelled = STAGES.some(function(s){ return st[s[0]] === 'Cancelled'; });
    if (cancelled) return { stage: 'All Stages Closed', status: 'Cancelled' };
    for (var i = 0; i < STAGES.length; i++) {
      var v = st[STAGES[i][0]] || '';
      if (!CLOSED[v]) return { stage: STAGES[i][2], status: v || 'Not Recorded' };
    }
    return { stage: 'All Stages Closed', status: 'Completed' };
  }

  function mount(el, o){
    var b = o.board || { stages:{}, customer:'', manager:'', comment:'', notes:'', respin:'No' };
    var L = o.lists || {};
    var isNew = !o.board;

    var rows = STAGES.map(function(s){
      var v = (b.stages && b.stages[s[0]]) || {};
      return '<div class="srow">' +
        '<span>' + esc(s[1]) + '</span>' +
        '<input data-k="owner" data-s="' + s[0] + '" placeholder="Owner" value="' + esc(v.owner) + '">' +
        '<select data-k="status" data-s="' + s[0] + '">' + opts(L.statuses, v.status || 'NA') + '</select>' +
        '<input data-k="target" data-s="' + s[0] + '" type="date" value="' + esc(v.target) + '">' +
      '</div>';
    }).join('');

    el.innerHTML =
      '<div class="form">' +
        '<h4>Board</h4>' +
        '<div class="f-grid">' +
          '<div class="f"><label for="pf-p">Project or board name</label>' +
            '<input id="pf-p" value="' + esc(b.project) + '"' + (isNew ? '' : '') + '></div>' +
          '<div class="f"><label for="pf-c">Customer</label>' +
            '<input id="pf-c" list="pf-cl" value="' + esc(b.customer) + '">' +
            '<datalist id="pf-cl">' + opts(L.customers, '') + '</datalist></div>' +
          '<div class="f"><label for="pf-m">Project manager</label>' +
            '<input id="pf-m" value="' + esc(b.manager) + '"></div>' +
          '<div class="f"><label for="pf-r">Revision or respin number</label>' +
            '<input id="pf-r" value="' + esc(b.rev) + '"></div>' +
        '</div>' +

        '<h4>Stages</h4>' + rows +

        '<h4>Notes</h4>' +
        '<div class="f"><label for="pf-cm">Latest comment</label>' +
          '<textarea id="pf-cm">' + esc(b.comment) + '</textarea></div>' +
        '<div class="f" style="margin-top:10px"><label for="pf-nt">Notes and data checks</label>' +
          '<textarea id="pf-nt">' + esc(b.notes) + '</textarea></div>' +

        (b.sheet === 'COMPLETED' ?
        '<div class="respin-box">' +
          '<p>This board is closed. To send it back into the workflow, pick the stage it has to return to.</p>' +
          '<div class="f-grid">' +
            '<div class="f"><label for="pf-re">Re-enter at stage</label>' +
              '<select id="pf-re">' + opts(L.stages, b.reentry, 'Not a respin') + '</select></div>' +
            '<div class="f"><label for="pf-rr">Reason</label>' +
              '<select id="pf-rr">' + opts(L.reasons, b.reason, 'Pick a reason') + '</select></div>' +
          '</div>' +
          '<div style="margin-top:9px"><button class="btn" id="pf-respin">Send back to Active</button></div>' +
        '</div>' : '') +

        '<div class="verdict" id="pf-v"></div>' +
      '</div>' +
      '<div class="bar">' +
        '<button class="btn btn-solid" id="pf-save">' + (isNew ? 'Add board' : 'Save changes') + '</button>' +
        '<button class="btn" id="pf-cancel">Cancel</button>' +
        '<span class="msg" id="pf-msg"></span>' +
      '</div>';

    var $ = function(id){ return el.querySelector('#' + id); };
    var msg = $('pf-msg');

    function read(){
      var st = {};
      STAGES.forEach(function(s){ st[s[0]] = { owner:'', status:'NA', target:'' }; });
      el.querySelectorAll('[data-s]').forEach(function(node){
        st[node.getAttribute('data-s')][node.getAttribute('data-k')] = node.value;
      });
      return {
        project: $('pf-p').value.trim(),
        customer: $('pf-c').value.trim(),
        manager: $('pf-m').value.trim(),
        rev: $('pf-r').value.trim(),
        comment: $('pf-cm').value.trim(),
        notes: $('pf-nt').value.trim(),
        stages: st,
        originalProject: b.project || ''
      };
    }

    function paint(){
      var st = {};
      el.querySelectorAll('[data-k="status"]').forEach(function(n){ st[n.getAttribute('data-s')] = n.value; });
      var v = verdict(st);
      var sheet = (v.status === 'Completed' || v.status === 'Cancelled') ? 'COMPLETED' : 'ACTIVE';
      $('pf-v').innerHTML = 'Current stage <b>' + esc(v.stage) + '</b> · status <b>' + esc(v.status) + '</b><br>' +
        '<em>Saving puts this board on the ' + sheet + ' sheet.</em>';
    }
    el.addEventListener('change', paint);
    paint();

    function run(fn, arg, label){
      msg.className = 'msg'; msg.textContent = label;
      $('pf-save').disabled = true;
      google.script.run
        .withSuccessHandler(function(res){
          msg.className = 'msg good';
          msg.textContent = 'Saved to ' + res.sheet + (res.moved ? ' — the board moved sheet.' : '.');
          $('pf-save').disabled = false;
          if (o.onSaved) o.onSaved(res);
        })
        .withFailureHandler(function(err){
          msg.className = 'msg bad';
          msg.textContent = err && err.message ? err.message : 'Could not save. Try again.';
          $('pf-save').disabled = false;
        })[fn](arg);
    }

    $('pf-save').addEventListener('click', function(){
      var p = read();
      if (!p.project) { msg.className = 'msg bad'; msg.textContent = 'Give the board a name first.'; return; }
      run('saveBoard', p, 'Saving…');
    });
    $('pf-cancel').addEventListener('click', function(){ if (o.onCancel) o.onCancel(); });

    if ($('pf-respin')) {
      $('pf-respin').addEventListener('click', function(){
        var stage = $('pf-re').value;
        if (!stage) { msg.className = 'msg bad'; msg.textContent = 'Pick the stage the board re-enters at.'; return; }
        run('respinBoard', {
          project: b.project, reentry: stage, reason: $('pf-rr').value,
          raised: new Date().toISOString().slice(0, 10), comment: $('pf-cm').value.trim()
        }, 'Sending back to Active…');
      });
    }
  }

  return { mount: mount, verdict: verdict, STAGES: STAGES };
})();
</script>


<script>
var S = { boards: [], lists: {}, q: '', cust: '', stage: '', filter: 'active', open: {}, sel: null, mode: 'view' };

var STAGES = PCBForm.STAGES;                       // [key, short, full]
var CLOSED = { 'Completed': 1, 'NA': 1, 'Cancelled': 1 };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function lateDays(b){ return typeof b.delay === 'number' && b.delay > 0 ? b.delay : 0; }
function isActive(b){ return b.overall !== 'Completed' && b.overall !== 'Cancelled'; }

/* ------------------------------------------------------------------ load */

function load(){
  $('hdr-meta').textContent = 'Reading the sheet…';
  if (window.PRELOADED) { return receive(window.PRELOADED); }
  google.script.run
    .withSuccessHandler(receive)
    .withFailureHandler(function(err){
      $('list').innerHTML = '<div class="empty"><b>Could not read the sheet</b>' +
        esc(err && err.message ? err.message : 'Check that the COMPLETED and ACTIVE tabs still exist.') + '</div>';
      $('hdr-meta').textContent = 'Not connected';
    })
    .getBoards();
}

function receive(data){
  S.boards = data.boards || [];
  S.lists = data.lists || {};
  var t = new Date(data.fetched || Date.now());
  $('hdr-meta').textContent = 'Updated ' + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('hdr-count').textContent = S.boards.length + ' boards';
  buildFilters();
  render();
}

function buildFilters(){
  var cs = Array.from(new Set(S.boards.map(function(b){ return b.customer; }))).sort();
  $('f-cust').innerHTML = '<option value="">Every project</option>' +
    cs.map(function(c){ return '<option' + (c === S.cust ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
  $('f-stage').innerHTML = '<option value="">Every stage</option>' +
    STAGES.map(function(s){ return '<option value="' + s[2] + '"' + (s[2] === S.stage ? ' selected' : '') +
      '>' + esc(s[2]) + '</option>'; }).join('');
}

/* ---------------------------------------------------------------- filters */

function visible(){
  var q = S.q.toLowerCase();
  return S.boards.filter(function(b){
    if (S.filter === 'active' && !isActive(b)) return false;
    if (S.filter === 'done' && isActive(b)) return false;
    if (S.filter === 'late' && !lateDays(b)) return false;
    if (S.filter === 'hold' && b.overall !== 'On Hold') return false;
    if (S.filter === 'wip' && b.overall !== 'In Progress') return false;
    if (S.filter === 'idle' && b.overall !== 'Not Started') return false;
    if (S.filter === 'respin' && b.respin !== 'Yes') return false;
    if (S.cust && b.customer !== S.cust) return false;
    if (S.stage && b.current !== S.stage) return false;
    if (q) {
      var hay = [b.project, b.customer, b.manager, b.comment].join(' ').toLowerCase();
      var owners = STAGES.map(function(s){ return (b.stages[s[0]] || {}).owner || ''; }).join(' ').toLowerCase();
      if (hay.indexOf(q) < 0 && owners.indexOf(q) < 0) return false;
    }
    return true;
  });
}

/* ----------------------------------------------------------------- render */

function render(){
  var act = S.boards.filter(isActive);

  // hero: stage load
  var max = 1;
  var per = STAGES.map(function(s){
    var at = act.filter(function(b){ return b.current === s[2]; });
    var late = at.filter(lateDays).length;
    max = Math.max(max, at.length);
    return { s: s, n: at.length, late: late };
  });
  $('load').innerHTML = per.map(function(p){
    var h = Math.round(18 + (p.n / max) * 74);
    var lateH = p.n ? Math.round(h * (p.late / p.n)) : 0;
    return '<button class="load-col" data-stage="' + p.s[2] + '">' +
      '<div class="load-n' + (p.n ? '' : ' zero') + '">' + p.n + '</div>' +
      '<div class="load-bar" style="height:' + h + 'px">' +
        '<div class="load-fill' + (lateH ? ' late' : '') + '" style="height:' + Math.max(lateH, p.n ? 4 : 0) + 'px"></div>' +
      '</div>' +
      '<div class="load-name">' + esc(p.s[1]) + '</div>' +
      '<div class="load-late">' + (p.late ? p.late + ' late' : '') + '</div>' +
    '</button>';
  }).join('');

  // stats — the three numbers Rajesh asks for first, then context
  var stats = [
    { k: 'wip',    n: act.filter(function(b){ return b.overall === 'In Progress'; }).length, l: 'In progress' },
    { k: 'hold',   n: act.filter(function(b){ return b.overall === 'On Hold'; }).length, l: 'On hold', c: 'hold' },
    { k: 'late',   n: act.filter(lateDays).length, l: 'Past due date', c: 'late' },
    { k: 'idle',   n: act.filter(function(b){ return b.overall === 'Not Started'; }).length, l: 'Not started' },
    { k: 'respin', n: S.boards.filter(function(b){ return b.respin === 'Yes'; }).length, l: 'Awaiting respin', c: 'respin' },
    { k: 'done',   n: S.boards.length - act.length, l: 'Closed' }
  ];
  $('stats').innerHTML = stats.map(function(x){
    return '<button class="stat ' + (x.c || '') + (S.filter === x.k ? ' on' : '') + '" data-k="' + x.k + '">' +
      '<div class="stat-n">' + x.n + '</div><div class="stat-l">' + esc(x.l) + '</div></button>';
  }).join('');

  // grouped list
  var rows = visible();
  $('count').textContent = rows.length + ' of ' + S.boards.length + ' shown';
  if (!rows.length) {
    $('list').innerHTML = '<div class="empty"><b>Nothing matches those filters</b>Clear the search or pick a different customer.</div>';
    return;
  }
  var by = {};
  rows.forEach(function(b){ (by[b.customer] = by[b.customer] || []).push(b); });
  var names = Object.keys(by).sort(function(a, c){
    return by[c].filter(isActive).length - by[a].filter(isActive).length || a.localeCompare(c);
  });

  $('list').innerHTML = names.map(function(name){
    var g = by[name];
    var late = g.filter(lateDays).length;
    var hold = g.filter(function(b){ return b.overall === 'On Hold'; }).length;
    var open = S.open[name] !== false;
    return '<section class="grp' + (open ? ' open' : '') + '" data-g="' + esc(name) + '">' +
      '<button class="grp-h"><span class="caret"></span><span class="grp-name">' + esc(name) + '</span>' +
        '<span class="grp-tags">' +
          '<span class="tag">' + g.length + ' board' + (g.length === 1 ? '' : 's') + '</span>' +
          (hold ? '<span class="tag hold">' + hold + ' on hold</span>' : '') +
          (late ? '<span class="tag late">' + late + ' past target</span>' : '') +
        '</span></button>' +
      '<div class="grp-body">' + g.map(rowHtml).join('') + '</div>' +
    '</section>';
  }).join('');
}

function fmt(iso){
  if (!iso) return '';
  var p = iso.split('-'); if (p.length !== 3) return iso;
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p[2] + ' ' + M[+p[1] - 1];
}
function overdue(iso){
  if (!iso) return false;
  return new Date(iso + 'T23:59:59') < new Date();
}

function rowHtml(b){
  var d = lateDays(b);
  var seen = false;
  var rail = STAGES.map(function(s, i){
    var v = b.stages[s[0]] || {};
    var st = v.status || '';
    var here = b.current === s[2];
    if (here) seen = true;
    var link = (!seen && st === 'Completed') ? ' linkdone' : '';
    var late = st !== 'Completed' && st !== 'NA' && overdue(v.target);
    return '<span class="node' + (here ? ' here' : '') + link + '" data-s="' + esc(st) + '" ' +
             'title="' + esc(s[2] + ': ' + (st || 'not recorded') + (v.owner ? ' — ' + v.owner : '')) + '">' +
             '<span class="pip"></span>' +
             '<span class="node-l">' + esc(s[1]) + '</span>' +
             '<span class="node-d' + (late ? ' over' : (v.target ? '' : ' none')) + '">' +
               (v.target ? fmt(v.target) : '·') + '</span>' +
           '</span>';
  }).join('');

  return '<button class="row" data-p="' + esc(b.project) + '">' +
    '<span class="row-top">' +
      '<span class="row-name">' + esc(b.project) +
        (S.cust ? '' : ' <span class="cust">' + esc(b.customer) + '</span>') + '</span>' +
      '<span class="row-right">' +
        '<span class="row-stage">' + esc(b.current === 'All Stages Closed' ? 'closed' : b.current) + '</span>' +
        '<span class="chip" data-s="' + esc(b.overall) + '">' + esc(b.overall) + '</span>' +
        '<span class="' + (d ? 'row-late' : 'row-late none') + '">' +
          (d ? d + ' days over' : (b.delay === 'No date' ? 'no due date' : 'on time')) + '</span>' +
      '</span>' +
    '</span>' +
    '<span class="rail7">' + rail + '</span>' +
    (b.comment ? '<span class="row-cmt">' + esc(b.comment) + '</span>' : '') +
  '</button>';
}

/* ------------------------------------------------------------ slide-over */

function openPanel(){ $('veil').classList.add('on'); $('panel').classList.add('on'); }
function closePanel(){
  $('veil').classList.remove('on'); $('panel').classList.remove('on');
  S.sel = null; S.mode = 'view';
}

function showBoard(project){
  var b = S.boards.filter(function(x){ return x.project === project; })[0];
  if (!b) return;
  S.sel = b; S.mode = 'view';
  $('panel-title').textContent = b.project;
  $('panel-sub').textContent = b.customer + ' · ' + (b.manager || 'no manager set') + ' · on the ' + b.sheet + ' sheet';

  var d = lateDays(b);
  var steps = STAGES.map(function(s, i){
    var v = b.stages[s[0]] || {};
    var st = v.status || '';
    var bits = [];
    if (v.owner) bits.push(esc(v.owner));
    if (v.target) bits.push('target ' + esc(v.target));
    return '<div class="step">' +
      '<div class="step-rail"><span class="dot" data-s="' + esc(st) + '"></span>' +
        (i < STAGES.length - 1 ? '<span class="rail"></span>' : '') + '</div>' +
      '<div class="step-b"><div class="step-t"><b>' + esc(s[2]) + '</b>' +
        '<span class="chip" data-s="' + esc(st) + '">' + esc(st || 'not recorded') + '</span></div>' +
        (bits.length ? '<div class="step-m">' + bits.join(' · ') + '</div>' : '') +
      '</div></div>';
  }).join('');

  $('panel-b').innerHTML =
    '<dl class="kv">' +
      '<dt>Current stage</dt><dd>' + esc(b.current) + '</dd>' +
      '<dt>Overall status</dt><dd><span class="chip" data-s="' + esc(b.overall) + '">' + esc(b.overall) + '</span></dd>' +
      '<dt>Against target</dt><dd>' + (d ? '<span style="color:var(--late);font-weight:600">' + d + ' days past</span>'
        : esc(b.delay === 'No date' ? 'no target date on this stage' : 'on target')) + '</dd>' +
      '<dt>Through process</dt><dd>' + (typeof b.pct === 'number' ? Math.round(b.pct * 100) + '%' : '—') + '</dd>' +
      (b.rev ? '<dt>Revision</dt><dd>' + esc(b.rev) + '</dd>' : '') +
      (b.respin === 'Yes' ? '<dt>Respin</dt><dd>flagged, re-entering at ' + esc(b.reentry || 'a stage not yet chosen') + '</dd>' : '') +
    '</dl>' +
    (b.comment ? '<div class="cmt">' + esc(b.comment) + '</div>' : '') +
    (b.notes ? '<div class="note">' + esc(b.notes) + '</div>' : '') +
    steps;

  $('panel-f').innerHTML =
    '<button class="btn btn-solid" id="p-edit">Edit this board</button>' +
    (b.sheet === 'COMPLETED' ? '<button class="btn" id="p-respin">Send back to Active</button>' : '') +
    '<button class="btn btn-quiet" id="p-close" style="margin-left:auto">Close</button>';

  $('p-close').onclick = closePanel;
  $('p-edit').onclick = function(){ showForm(b); };
  if ($('p-respin')) $('p-respin').onclick = function(){ showForm(b); };
  openPanel();
}

function showForm(board){
  S.mode = 'edit';
  $('panel-title').textContent = board ? board.project : 'New board';
  $('panel-sub').textContent = board ? 'Editing — saving puts it on whichever sheet its stages call for'
                                     : 'Fill in what you know. Stages you leave as NA will not block completion.';
  $('panel-f').innerHTML = '';
  PCBForm.mount($('panel-b'), {
    board: board, lists: S.lists,
    onSaved: function(){ load(); setTimeout(closePanel, 1100); },
    onCancel: function(){ board ? showBoard(board.project) : closePanel(); }
  });
  openPanel();
}

/* ------------------------------------------------------------------ wire */

document.addEventListener('click', function(e){
  var row = e.target.closest('.row');
  if (row) return showBoard(row.getAttribute('data-p'));

  var gh = e.target.closest('.grp-h');
  if (gh) {
    var g = gh.closest('.grp'), n = g.getAttribute('data-g');
    S.open[n] = !g.classList.contains('open');
    g.classList.toggle('open');
    return;
  }
  var stat = e.target.closest('.stat');
  if (stat) { var k = stat.getAttribute('data-k'); S.filter = (S.filter === k ? 'all' : k); return render(); }

  var col = e.target.closest('.load-col');
  if (col) { S.stage = (S.stage === col.getAttribute('data-stage') ? '' : col.getAttribute('data-stage'));
             $('f-stage').value = S.stage; return render(); }
});

$('veil').onclick = closePanel;
$('panel-x').onclick = closePanel;
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePanel(); });

$('q').addEventListener('input', function(){ S.q = this.value; render(); });
$('f-cust').addEventListener('change', function(){ S.cust = this.value; render(); });
$('f-stage').addEventListener('change', function(){ S.stage = this.value; render(); });
$('btn-refresh').onclick = load;
$('btn-add').onclick = function(){ showForm(null); };
$('btn-expand').onclick = function(){
  var anyClosed = document.querySelector('.grp:not(.open)');
  document.querySelectorAll('.grp').forEach(function(g){
    S.open[g.getAttribute('data-g')] = !!anyClosed;
    g.classList.toggle('open', !!anyClosed);
  });
  this.textContent = anyClosed ? 'Collapse all' : 'Expand all';
};

load();
if (!window.PRELOADED) setInterval(function(){ if (S.mode === 'view') load(); }, 60000);
</script>
