<script>
/**
 * PCBForm.mount(el, opts)
 *   opts.board   existing board object, or null for a new one
 *   opts.lists   { statuses, stages, reasons, customers }
 *   opts.onSaved callback(result)
 *   opts.onCancel
 * Works inside the Sheets modal and inside the dashboard.
 */
window.PCBForm = (function () {
  var STAGES = [
    ['S1','Schematic','S1 Schematic'],
    ['S2','BOM','S2 BOM Procurement'],
    ['S3','Layout','S3 PCB Layout'],
    ['S4','SI & PI','S4 SI & PI'],
    ['S5','Fab','S5 Bare-PCB Fab'],
    ['S6','Assembly','S6 Assembly'],
    ['S7','Bring-up','S7 Bring-up']
  ];
  var CLOSED = { 'Completed':1, 'NA':1, 'Cancelled':1 };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function opts(list, sel, blank){
    var h = blank ? '<option value="">' + esc(blank) + '</option>' : '';
    (list || []).forEach(function(v){
      h += '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>';
    });
    if (sel && (list || []).indexOf(sel) < 0) h += '<option value="' + esc(sel) + '" selected>' + esc(sel) + '</option>';
    return h;
  }

  /** Mirrors the sheet formula so the form can tell you where the board will land. */
  function verdict(st){
    var cancelled = STAGES.some(function(s){ return st[s[0]] === 'Cancelled'; });
    if (cancelled) return { stage: 'All Stages Closed', status: 'Cancelled' };
    for (var i = 0; i < STAGES.length; i++) {
      var v = st[STAGES[i][0]] || '';
      if (!CLOSED[v]) return { stage: STAGES[i][2], status: v || 'Not Recorded' };
    }
    return { stage: 'All Stages Closed', status: 'Completed' };
  }

  function mount(el, o){
    var b = o.board || { stages:{}, customer:'', manager:'', comment:'', notes:'', respin:'No' };
    var L = o.lists || {};
    var isNew = !o.board;

    var rows = STAGES.map(function(s){
      var v = (b.stages && b.stages[s[0]]) || {};
      return '<div class="srow">' +
        '<span>' + esc(s[1]) + '</span>' +
        '<input data-k="owner" data-s="' + s[0] + '" placeholder="Owner" value="' + esc(v.owner) + '">' +
        '<select data-k="status" data-s="' + s[0] + '">' + opts(L.statuses, v.status || 'NA') + '</select>' +
        '<input data-k="target" data-s="' + s[0] + '" type="date" value="' + esc(v.target) + '">' +
      '</div>';
    }).join('');

    el.innerHTML =
      '<div class="form">' +
        '<h4>Board</h4>' +
        '<div class="f-grid">' +
          '<div class="f"><label for="pf-p">Project or board name</label>' +
            '<input id="pf-p" value="' + esc(b.project) + '"' + (isNew ? '' : '') + '></div>' +
          '<div class="f"><label for="pf-c">Customer</label>' +
            '<input id="pf-c" list="pf-cl" value="' + esc(b.customer) + '">' +
            '<datalist id="pf-cl">' + opts(L.customers, '') + '</datalist></div>' +
          '<div class="f"><label for="pf-m">Project manager</label>' +
            '<input id="pf-m" value="' + esc(b.manager) + '"></div>' +
          '<div class="f"><label for="pf-r">Revision or respin number</label>' +
            '<input id="pf-r" value="' + esc(b.rev) + '"></div>' +
        '</div>' +

        '<h4>Stages</h4>' + rows +

        '<h4>Notes</h4>' +
        '<div class="f"><label for="pf-cm">Latest comment</label>' +
          '<textarea id="pf-cm">' + esc(b.comment) + '</textarea></div>' +
        '<div class="f" style="margin-top:10px"><label for="pf-nt">Notes and data checks</label>' +
          '<textarea id="pf-nt">' + esc(b.notes) + '</textarea></div>' +

        (b.sheet === 'COMPLETED' ?
        '<div class="respin-box">' +
          '<p>This board is closed. To send it back into the workflow, pick the stage it has to return to.</p>' +
          '<div class="f-grid">' +
            '<div class="f"><label for="pf-re">Re-enter at stage</label>' +
              '<select id="pf-re">' + opts(L.stages, b.reentry, 'Not a respin') + '</select></div>' +
            '<div class="f"><label for="pf-rr">Reason</label>' +
              '<select id="pf-rr">' + opts(L.reasons, b.reason, 'Pick a reason') + '</select></div>' +
          '</div>' +
          '<div style="margin-top:9px"><button class="btn" id="pf-respin">Send back to Active</button></div>' +
        '</div>' : '') +

        '<div class="verdict" id="pf-v"></div>' +
      '</div>' +
      '<div class="bar">' +
        '<button class="btn btn-solid" id="pf-save">' + (isNew ? 'Add board' : 'Save changes') + '</button>' +
        '<button class="btn" id="pf-cancel">Cancel</button>' +
        '<span class="msg" id="pf-msg"></span>' +
      '</div>';

    var $ = function(id){ return el.querySelector('#' + id); };
    var msg = $('pf-msg');

    function read(){
      var st = {};
      STAGES.forEach(function(s){ st[s[0]] = { owner:'', status:'NA', target:'' }; });
      el.querySelectorAll('[data-s]').forEach(function(node){
        st[node.getAttribute('data-s')][node.getAttribute('data-k')] = node.value;
      });
      return {
        project: $('pf-p').value.trim(),
        customer: $('pf-c').value.trim(),
        manager: $('pf-m').value.trim(),
        rev: $('pf-r').value.trim(),
        comment: $('pf-cm').value.trim(),
        notes: $('pf-nt').value.trim(),
        stages: st,
        originalProject: b.project || ''
      };
    }

    function paint(){
      var st = {};
      el.querySelectorAll('[data-k="status"]').forEach(function(n){ st[n.getAttribute('data-s')] = n.value; });
      var v = verdict(st);
      var sheet = (v.status === 'Completed' || v.status === 'Cancelled') ? 'COMPLETED' : 'ACTIVE';
      $('pf-v').innerHTML = 'Current stage <b>' + esc(v.stage) + '</b> · status <b>' + esc(v.status) + '</b><br>' +
        '<em>Saving puts this board on the ' + sheet + ' sheet.</em>';
    }
    el.addEventListener('change', paint);
    paint();

    function run(fn, arg, label){
      msg.className = 'msg'; msg.textContent = label;
      $('pf-save').disabled = true;
      google.script.run
        .withSuccessHandler(function(res){
          msg.className = 'msg good';
          msg.textContent = 'Saved to ' + res.sheet + (res.moved ? ' — the board moved sheet.' : '.');
          $('pf-save').disabled = false;
          if (o.onSaved) o.onSaved(res);
        })
        .withFailureHandler(function(err){
          msg.className = 'msg bad';
          msg.textContent = err && err.message ? err.message : 'Could not save. Try again.';
          $('pf-save').disabled = false;
        })[fn](arg);
    }

    $('pf-save').addEventListener('click', function(){
      var p = read();
      if (!p.project) { msg.className = 'msg bad'; msg.textContent = 'Give the board a name first.'; return; }
      run('saveBoard', p, 'Saving…');
    });
    $('pf-cancel').addEventListener('click', function(){ if (o.onCancel) o.onCancel(); });

    if ($('pf-respin')) {
      $('pf-respin').addEventListener('click', function(){
        var stage = $('pf-re').value;
        if (!stage) { msg.className = 'msg bad'; msg.textContent = 'Pick the stage the board re-enters at.'; return; }
        run('respinBoard', {
          project: b.project, reentry: stage, reason: $('pf-rr').value,
          raised: new Date().toISOString().slice(0, 10), comment: $('pf-cm').value.trim()
        }, 'Sending back to Active…');
      });
    }
  }

  return { mount: mount, verdict: verdict, STAGES: STAGES };
})();
</script>
